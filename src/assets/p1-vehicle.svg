  <line x1="625" y1="391" x2="625" y2="451" stroke="#33363F" stroke-width="6"/>
  <line x1="490" y1="446" x2="560" y2="398" stroke="#88B8FF" stroke-width="4" opacity="0.3"/>
  <rect x="470" y="458" width="300" height="62" fill="none" stroke="#4A4A44" stroke-width="2"/>
  <rect x="722" y="468" width="34" height="8" rx="4" fill="#55554E"/>
  <path d="M204,522 A66,66 0 0 1 336,522 Z" fill="#10100F"/>
  <path d="M884,522 A66,66 0 0 1 1016,522 Z" fill="#10100F"/>
  <path d="M90,496 L152,488 L148,502 L92,508 Z" fill="#F2EBDD" opacity="0.9"/>
  <rect x="1104" y="488" width="24" height="10" fill="#FF4338"/>
  <g>
    <circle cx="270" cy="522" r="54" fill="#151513" stroke="#2E2E2A" stroke-width="3"/>
    <circle cx="270" cy="522" r="27" fill="#1E1E1C" stroke="#70706B" stroke-width="3"/>
    <line x1="270" y1="495" x2="270" y2="549" stroke="#70706B" stroke-width="3"/>
    <line x1="243" y1="522" x2="297" y2="522" stroke="#70706B" stroke-width="3"/>
    <circle cx="270" cy="522" r="6" fill="#D8FF3E"/>
  </g>
  <g>
    <circle cx="950" cy="522" r="54" fill="#151513" stroke="#2E2E2A" stroke-width="3"/>
    <circle cx="950" cy="522" r="27" fill="#1E1E1C" stroke="#70706B" stroke-width="3"/>
    <line x1="950" y1="495" x2="950" y2="549" stroke="#70706B" stroke-width="3"/>
    <line x1="923" y1="522" x2="977" y2="522" stroke="#70706B" stroke-width="3"/>
